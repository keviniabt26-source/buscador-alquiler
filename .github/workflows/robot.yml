name: Buscar pisos

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # minutos «raros»: a las horas en punto GitHub va saturado y se salta ejecuciones
  workflow_dispatch:          # botón para lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write             # para guardar la memoria del robot (estado/estado.json)

concurrency:
  group: robot-pisos          # nunca dos ejecuciones a la vez
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar el robot
        run: python robot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SAL_TELEFONOS: ${{ secrets.SAL_TELEFONOS }}
          TELEGRAM_SEGUIMIENTO_ID: ${{ secrets.TELEGRAM_SEGUIMIENTO_ID }}
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_CLAVE_APP: ${{ secrets.GMAIL_CLAVE_APP }}
          DATOS_NOMBRES: ${{ secrets.DATOS_NOMBRES }}
          DATOS_FIRMA: ${{ secrets.DATOS_FIRMA }}
          DATOS_FIRMA_CORREO: ${{ secrets.DATOS_FIRMA_CORREO }}
          DATOS_TELEFONO: ${{ secrets.DATOS_TELEFONO }}
          DATOS_TRABAJO_1: ${{ secrets.DATOS_TRABAJO_1 }}
          DATOS_TRABAJO_2: ${{ secrets.DATOS_TRABAJO_2 }}
          DATOS_TITULARES: ${{ secrets.DATOS_TITULARES }}

      - name: Guardar la memoria del robot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado/estado.json
          if git diff --cached --quiet; then
            echo "Nada nuevo que guardar"
          else
            git commit -m "Memoria del robot actualizada"
            git pull --rebase --quiet || true
            git push
          fi
