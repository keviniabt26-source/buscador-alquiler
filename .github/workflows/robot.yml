name: Buscar pisos

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minutos (GitHub a veces se retrasa unos minutos)
  workflow_dispatch:          # botón para lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write             # para guardar la memoria del robot (estado/estado.json)

concurrency:
  group: robot-pisos          # nunca dos ejecuciones a la vez
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar el robot
        run: python robot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SAL_TELEFONOS: ${{ secrets.SAL_TELEFONOS }}

      - name: Guardar la memoria del robot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado/estado.json
          if git diff --cached --quiet; then
            echo "Nada nuevo que guardar"
          else
            git commit -m "Memoria del robot actualizada"
            git pull --rebase --quiet || true
            git push
          fi
